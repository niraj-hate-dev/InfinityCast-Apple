name: Build InfinityCast Native IPA

on:
  push:
    branches: [ niraj, main ]
  pull_request:
    branches: [ niraj, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Native iOS IPA (Unsigned)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Native App & Extension
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ApowerMirror.xcodeproj \
            -scheme ApowerMirror \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || {
              echo "### Compilation Error in xcodebuild" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -in "error:" xcodebuild.log | head -n 40 >> $GITHUB_STEP_SUMMARY || true
              tail -n 80 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-compilation-logs
          path: xcodebuild.log

      - name: Package Unsigned InfinityCast IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "ApowerMirror.app" | head -n 1)
          echo "=== Found Compiled App: $APP_PATH ==="

          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/InfinityCast.app

          # Ensure Display Name is strictly 'InfinityCast'
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName InfinityCast" build/Payload/InfinityCast.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string InfinityCast" build/Payload/InfinityCast.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName InfinityCast" build/Payload/InfinityCast.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleName string InfinityCast" build/Payload/InfinityCast.app/Info.plist

          # Ensure Screen Broadcast Extension is preserved and branded InfinityCast
          if [ -d "build/derivedData/Build/Products/Release-iphoneos/ApowerMirrorUpload.appex" ]; then
            mkdir -p build/Payload/InfinityCast.app/PlugIns
            cp -r "build/derivedData/Build/Products/Release-iphoneos/ApowerMirrorUpload.appex" build/Payload/InfinityCast.app/PlugIns/
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName InfinityCast" build/Payload/InfinityCast.app/PlugIns/ApowerMirrorUpload.appex/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string InfinityCast" build/Payload/InfinityCast.app/PlugIns/ApowerMirrorUpload.appex/Info.plist
            echo "=== Screen Broadcast Extension Embedded and branded InfinityCast ==="
          fi

          echo "=== Verifying Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" build/Payload/InfinityCast.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/Payload/InfinityCast.app/Info.plist

          cd build
          zip -r InfinityCast.ipa Payload
          cp InfinityCast.ipa InfinityCast-v1.6.0-Native-Unsigned.ipa
          cp InfinityCast.ipa ApowerMirror-v1.6.0-Native-Unsigned.ipa
          echo "=== InfinityCast IPA Generated Successfully ==="
          ls -lh *.ipa

      - name: Upload InfinityCast IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCast-v1.6.0-Native-Unsigned
          path: build/InfinityCast.ipa
          retention-days: 14

      - name: Publish IPA to GitHub Release (Versioned)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/niraj' || github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: "v1.7.0-build.${{ github.run_number }}"
          name: "InfinityCast v1.7.0 (Build ${{ github.run_number }})"
          make_latest: true
          body: |
            ## 🚀 InfinityCast v1.7.0 Release
            
            ### Included Assets:
            - **`InfinityCast.ipa`**: Native iOS Screen Broadcast Mirroring App with ReplayKit Extension (Branded **InfinityCast**).
            - **`InfinityCast-Control.ipa`**: XCUITest Runner IPA for background multi-touch session.
            - **`InfinityCast-v1.6.0-Native-Unsigned.ipa`**: Standalone native unsigned bundle.
            - **`ApowerMirror-v1.6.0-Native-Unsigned.ipa`**: Compatibility bundle.
            
            ### What's New in v1.7.0:
            - **Universal HID Hardware Touch Support**: Zero-app USB touch injection on iOS 18+ bypassing sandbox suspension when Free Fire is open.
            - **Multi-Touch Support**: Up to 5 simultaneous touch points (WASD joystick, Camera look, and action keys).
            - **ReplayKit Screen Broadcast Extension**: Preserved and branded InfinityCast.
            - **Windows Software Integration**: Real-time Universal HID indicator in the top bar and Keymap Editor drawer.
          files: |
            build/InfinityCast.ipa
            build/InfinityCast-v1.6.0-Native-Unsigned.ipa
            build/ApowerMirror-v1.6.0-Native-Unsigned.ipa
            InfinityCast-Control.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update v1.7.0 Release Tag
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/niraj' || github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.7.0
          name: "InfinityCast v1.7.0 (Latest Release)"
          make_latest: true
          body: |
            ## 🚀 InfinityCast v1.7.0 (Latest)
            
            ### Included Assets:
            - **`InfinityCast.ipa`**: Native iOS Screen Broadcast Mirroring App with ReplayKit Extension (Branded **InfinityCast**).
            - **`InfinityCast-Control.ipa`**: XCUITest Runner IPA for background multi-touch session.
            - **`InfinityCast-v1.6.0-Native-Unsigned.ipa`**: Standalone native unsigned bundle.
            - **`ApowerMirror-v1.6.0-Native-Unsigned.ipa`**: Compatibility bundle.
          files: |
            build/InfinityCast.ipa
            build/InfinityCast-v1.6.0-Native-Unsigned.ipa
            build/ApowerMirror-v1.6.0-Native-Unsigned.ipa
            InfinityCast-Control.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
