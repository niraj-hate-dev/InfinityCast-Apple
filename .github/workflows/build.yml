name: Build AppleCast (Windows & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==============================================================
  # Job 1: Windows Native Desktop Core & Host Build
  # ==============================================================
  build-windows:
    name: Build Windows Host Client
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Tools
        run: |
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Execute Automated Unit & Widget Tests
        run: flutter test

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $buildDir = "build/windows/x64/runner/Release"
          if (Test-Path "windows/third_party/ffmpeg") {
            Copy-Item "windows/third_party/ffmpeg/*" $buildDir -Force
          }
          $outputZip = "AppleCast-Windows-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $outputZip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleCast-Windows-x64
          path: AppleCast-Windows-x64.zip
          retention-days: 14

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "AppleCast Latest Release"
          files: AppleCast-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



