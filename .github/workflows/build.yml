name: Build AppleCast (Windows & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==============================================================
  # Job 1: Windows Native Desktop Core & Host Build
  # ==============================================================
  build-windows:
    name: Build Windows Host Client
    runs-on: windows-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Tools
        run: |
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Execute Automated Unit & Widget Tests
        run: flutter test

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $buildDir = "build/windows/x64/runner/Release"
          if (Test-Path "windows/third_party/ffmpeg") {
            Copy-Item "windows/third_party/ffmpeg/*" $buildDir -Force
          }
          $outputZip = "AppleCast-Windows-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $outputZip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleCast-Windows-x64
          path: AppleCast-Windows-x64.zip
          retention-days: 14

  # ==============================================================
  # Job 2: iOS Companion App & ReplayKit Extension Build
  # ==============================================================
  build-ios:
    name: Build iOS Companion & Extension
    runs-on: macos-14

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (Unsigned for Sideloading)
        run: flutter build ios --no-codesign --release

      - name: Package Unsigned IPA for Sideloaders (AltStore / Sideloadly)
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/

          RUNNER_PLIST="build/ios/ipa/Payload/Runner.app/Info.plist"
          EXT_PLIST="build/ios/ipa/Payload/Runner.app/PlugIns/AppleCastExtension.appex/Info.plist"

          echo "=== Inspecting Runner and Extension Plists ==="
          RUNNER_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_PLIST")
          RUNNER_MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$RUNNER_PLIST" 2>/dev/null || echo "15.0")
          RUNNER_SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_PLIST" 2>/dev/null || echo "1.0.0")
          RUNNER_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$RUNNER_PLIST" 2>/dev/null || echo "1")

          echo "Runner Bundle ID: $RUNNER_BUNDLE_ID"
          echo "Runner MinimumOSVersion: $RUNNER_MIN_OS"
          echo "Runner Short Version: $RUNNER_SHORT_VER"
          echo "Runner Build Version: $RUNNER_VER"

          if [ -f "$EXT_PLIST" ]; then
            echo "Configuring AppleCastExtension.appex/Info.plist with exact Runner metadata..."
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${RUNNER_BUNDLE_ID}.AppleCastExtension" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string ${RUNNER_BUNDLE_ID}.AppleCastExtension" "$EXT_PLIST"

            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion ${RUNNER_MIN_OS}" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string ${RUNNER_MIN_OS}" "$EXT_PLIST"

            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${RUNNER_SHORT_VER}" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${RUNNER_SHORT_VER}" "$EXT_PLIST"

            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${RUNNER_VER}" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${RUNNER_VER}" "$EXT_PLIST"

            /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType XPC!" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string XPC!" "$EXT_PLIST"

            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable AppleCastExtension" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string AppleCastExtension" "$EXT_PLIST"

            /usr/libexec/PlistBuddy -c "Set :CFBundleName AppleCastExtension" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string AppleCastExtension" "$EXT_PLIST"

            /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionPrincipalClass SampleHandler" "$EXT_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPrincipalClass string SampleHandler" "$EXT_PLIST"

            echo "=== Verified AppleCastExtension.appex Info.plist ==="
            /usr/libexec/PlistBuddy -c "Print" "$EXT_PLIST"
          else
            echo "::error::AppleCastExtension.appex/Info.plist not found in Payload!"
            exit 1
          fi

          echo "=== Contents of Runner.app/PlugIns ==="
          ls -la build/ios/ipa/Payload/Runner.app/PlugIns || true

          cd build/ios/ipa
          zip -qr AppleCast-iOS-Unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleCast-iOS-Unsigned
          path: build/ios/ipa/AppleCast-iOS-Unsigned.ipa
          retention-days: 14

  # ==============================================================
  # Job 3: Automated GitHub Release (Direct Downloads)
  # ==============================================================
  publish-release:
    name: Publish Release (Direct Downloads)
    needs: [build-windows, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Windows Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: AppleCast-Windows-x64
          path: release-binaries

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: AppleCast-iOS-Unsigned
          path: release-binaries

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "AppleCast Latest Release"
          body: |
            ### AppleCast Automated Build
            
            Direct downloads:
            - **iOS Sideloadable IPA:** `AppleCast-iOS-Unsigned.ipa`
            - **Windows Host Client:** `AppleCast-Windows-x64.zip`
          files: |
            release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

